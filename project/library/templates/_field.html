<div class="field">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req" aria-hidden="true">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p class="hint">{{ field.help_text }}</p>{% endif %}
  <p class="error-text" data-error-for="{{ field.id_for_label }}"{% if not field.errors %} hidden{% endif %}>{% for e in field.errors %}{{ e }} {% endfor %}</p>
</div>
