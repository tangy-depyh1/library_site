{% extends "error_base.html" %}
{% block title %}Страница не найдена — Библиотека колледжа{% endblock %}
{% block content %}
<section class="panel error-page">
    <p class="error-page__code">404</p>
    <h1>Страница не найдена</h1>
    <p>Возможно, ссылка устарела или запись была удалена. Проверьте адрес или найдите книгу в каталоге.</p>
    <div class="actions error-page__actions">
        <a class="btn btn-primary" href="{% url 'home' %}">На главную</a>
        <a class="btn btn-secondary" href="{% url 'search' %}">Перейти к поиску</a>
    </div>
</section>
{% endblock %}
