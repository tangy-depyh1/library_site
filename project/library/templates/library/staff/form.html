{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<form method="post">
    {% csrf_token %}
    {% if form.non_field_errors %}<div class="alert alert-error" role="alert">{{ form.non_field_errors }}</div>{% endif %}
    {% for field in form %}
    {% include "_field.html" with field=field %}
    {% endfor %}
    <button class="btn btn-primary" type="submit">Сохранить</button>
    <a class="btn btn-secondary" href="{% url cancel_url %}">Отмена</a>
</form>
{% endblock %}
