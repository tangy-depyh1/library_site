{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<p>Удалить «{{ object }}»?</p>
<form method="post">
    {% csrf_token %}
    <button class="btn btn-primary" type="submit">Удалить</button>
    <a class="btn btn-secondary" href="{% url cancel_url %}">Отмена</a>
</form>
{% endblock %}
